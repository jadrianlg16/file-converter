# Reverse proxy for compose.isolated.yml: the only container with a route to
# the host. It forwards to the converter, which sits on an internal network
# with no internet access.
server {
    listen 80;
    server_tokens off;

    # Same cap as the app's MAX_UPLOAD_MB default; the app enforces its own.
    client_max_body_size 200m;

    location / {
        proxy_pass http://converter:5007;
        # gunicorn's worker timeout; LibreOffice and Calibre can be slow.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        # Appends the client nginx saw; the converter trusts exactly this one
        # entry (DEMO_PROXY_HOPS=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
